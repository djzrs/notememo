name = "notememo"
main = "src/index.js"
compatibility_date = "2025-01-01"
workers_dev = true

# ============================================================
# KV 数据持久化绑定（必须保留）
# 备忘录数据持久化到 Cloudflare KV。binding 变量名必须与代码
# src/index.js 中 createStore(env) 读取的 env.NOTES 一致。
# 不要删掉下面的绑定，否则部署会回到内存模式导致数据不可读。
# ============================================================
[[kv_namespaces]]
binding = "NOTES"
id = "09901a5f4cba4f5b99093dfa2c177391"